name: Deploy

# Manual only. This spends money, so it is never triggered by a push.
#
#   ECR -> Terraform validate -> plan -> apply -> CodeDeploy blue-green
#       -> health checks -> verify -> seed -> E2E -> rollback if needed

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev]
      confirm:
        description: Type DEPLOY to confirm this will spend money
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC. No stored AWS access keys anywhere.

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt an in-flight deployment

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_CODE: ekba

jobs:
  guard:
    name: Confirmation guard
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::You must type DEPLOY to confirm. Nothing was deployed."
          exit 1

  deploy:
    name: Build, deploy, verify
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ inputs.environment }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- preflight -----------------------------------------------------
      - name: Verify account and region
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "account: $ACCOUNT   region: $AWS_REGION"
          if [ "$ACCOUNT" != "${{ vars.EXPECTED_AWS_ACCOUNT_ID }}" ]; then
            echo "::error::Wrong AWS account ($ACCOUNT). STOPPING."
            exit 1
          fi

      # The $20 ceiling, enforced before anything is created.
      - name: Cost guard
        run: |
          SPEND=$(aws ce get-cost-and-usage \
            --time-period Start=$(date -u +%Y-%m-01),End=$(date -u -d '+1 day' +%Y-%m-%d) \
            --granularity MONTHLY --metrics UnblendedCost \
            --query 'ResultsByTime[0].Total.UnblendedCost.Amount' --output text 2>/dev/null || echo 0)
          CEILING=${{ vars.MAX_MONTHLY_SPEND_USD || 20 }}
          echo "month-to-date: \$$SPEND of \$$CEILING"
          if awk -v s="$SPEND" -v c="$CEILING" 'BEGIN{exit !(s+0 >= c+0)}'; then
            echo "::error::Spend ceiling reached. Refusing to deploy."
            exit 1
          fi

      # ---- build and push -------------------------------------------------
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.PROJECT_CODE }}-${{ inputs.environment }}-backend
          TAG: ${{ github.sha }}
        run: |
          # Immutable SHA tag. Never :latest. Re-running the workflow for the
          # same commit reuses the image already in ECR instead of attempting
          # an overwrite that tag immutability rejects. The checkout is always
          # clean, so the tag is guaranteed to match the commit.
          if OUT=$(aws ecr describe-images --repository-name "$REPO" \
                --image-ids imageTag="$TAG" 2>&1); then
            echo "image $TAG already in ECR - reusing it"
          elif echo "$OUT" | grep -q ImageNotFoundException; then
            docker build -f infra/docker/backend.Dockerfile -t "$REGISTRY/$REPO:$TAG" .
            docker push "$REGISTRY/$REPO:$TAG"
          else
            echo "::error::could not query ECR: $OUT"
            exit 1
          fi
          echo "image=$REGISTRY/$REPO:$TAG" >> "$GITHUB_OUTPUT"

      - name: Block on critical image findings
        env:
          REPO: ${{ env.PROJECT_CODE }}-${{ inputs.environment }}-backend
          TAG: ${{ github.sha }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$REPO" --image-id imageTag="$TAG" || true
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo None)
          echo "critical findings: $CRITICAL"
          if [ "$CRITICAL" != "None" ] && [ "$CRITICAL" != "0" ]; then
            echo "::error::$CRITICAL critical findings. Not deploying."
            exit 1
          fi

      # ---- infrastructure --------------------------------------------------
      - uses: hashicorp/setup-terraform@v3
        with:
          # 1.11+: the RDS password is a write-only argument (never in state).
          terraform_version: "1.15.8"

      # A NEW database instance is rebuilt from the newest snapshot destroy.sh
      # took (same logic as scripts/deploy.sh). Ignored while the instance exists.
      - name: Find the database snapshot to restore
        id: snapshot
        env:
          DB: ${{ env.PROJECT_CODE }}-${{ inputs.environment }}-postgres
        run: |
          ID=""
          if ! aws rds describe-db-instances --db-instance-identifier "$DB" >/dev/null 2>&1; then
            ID=$(aws rds describe-db-snapshots --db-instance-identifier "$DB" --snapshot-type manual \
              --query 'reverse(sort_by(DBSnapshots[?Status==`available`], &SnapshotCreateTime))[0].DBSnapshotIdentifier' \
              --output text)
            [ "$ID" = "None" ] && ID=""
          fi
          echo "restore snapshot: ${ID:-none}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        env:
          TF_VAR_backend_image: ${{ steps.build.outputs.image }}
          TF_VAR_expected_aws_account_id: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          TF_VAR_allowed_cidrs: '["${{ vars.DEMO_ALLOWED_CIDR }}"]'
          TF_VAR_s3_bucket: ${{ vars.S3_BUCKET }}
          TF_VAR_cognito_client_id: ${{ vars.COGNITO_CLIENT_ID }}
          TF_VAR_restore_snapshot_id: ${{ steps.snapshot.outputs.id }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=ekba-tfstate-${{ vars.EXPECTED_AWS_ACCOUNT_ID }}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=ekba-tfstate-lock" \
            -backend-config="encrypt=true"
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -out=tfplan

      # A deploy must never destroy. Surface it loudly if the plan says otherwise.
      - name: Reject destructive plans
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: |
          # Rendered plan, not raw JSON: the JSON drift section reports
          # resources deleted OUTSIDE Terraform as {"actions":["delete"]}.
          DESTROYS=$(terraform show -no-color tfplan \
            | grep -cE '^[[:space:]]+# .* will be destroyed' || true)
          echo "resources to be destroyed: $DESTROYS"
          if [ "$DESTROYS" -gt 0 ]; then
            terraform show -no-color tfplan | grep -E '^\s+# .*(destroyed|replaced)' || true
            echo "::error::Plan destroys $DESTROYS resource(s). A deploy must not destroy. Review manually."
            exit 1
          fi

      - name: Terraform apply
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: terraform apply -input=false tfplan

      # ---- blue-green release ---------------------------------------------
      - name: CodeDeploy blue-green
        env:
          APP: ${{ env.PROJECT_CODE }}-${{ inputs.environment }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition "$APP" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          cat > appspec.json <<EOF
          {
            "version": 0.0,
            "Resources": [{
              "TargetService": {
                "Type": "AWS::ECS::Service",
                "Properties": {
                  "TaskDefinition": "$TASK_DEF_ARN",
                  "LoadBalancerInfo": { "ContainerName": "api", "ContainerPort": 8000 }
                }
              }
            }]
          }
          EOF

          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "$APP" \
            --deployment-group-name "$APP-dg" \
            --revision "revisionType=AppSpecContent,appSpecContent={content='$(cat appspec.json | tr -d '\n')'}" \
            --query 'deploymentId' --output text)

          echo "deployment: $DEPLOY_ID"
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

          # Traffic shifts only after green passes its health checks.
          aws deploy wait deployment-successful --deployment-id "$DEPLOY_ID"

      # ---- post-deploy: an unverified deploy is a FAILED deploy ------------
      - name: Health check
        working-directory: infra/terraform/envs/${{ inputs.environment }}
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/api/v1/health"; then echo " healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::health check never passed"
          exit 1

      - name: Verify
        run: ./scripts/verify.sh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          API_URL: ${{ env.APP_URL }}

      # No seed/e2e step here: the task migrates and seeds itself at startup
      # (RDS is in private subnets nothing outside the VPC can reach), and
      # seed.sh / test-e2e.sh target the LOCAL stack, not the deployed one.

      # ---- rollback --------------------------------------------------------
      - name: Roll back on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed after release. Rolling the application back."
          aws deploy stop-deployment --deployment-id "$DEPLOY_ID" --auto-rollback-enabled || true
        env:
          DEPLOY_ID: ${{ env.DEPLOY_ID }}

      - name: Cost reminder
        if: always()
        run: |
          echo "::notice::Burning ~\$0.11/hour (incl. RDS). Run scripts/destroy.sh when the demo ends - it snapshots the database first."
